name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.1.0
        with:
          go-version: '1.27.4'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential ffmpeg flac libasound2-dev libflac-dev libmpg123-dev libogg-dev libvorbis-dev
      - name: Collect third-party licenses
        run: python3 scripts/collect-licenses.py
      - name: Build release and manifest
        env:
          UPDATE_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
        run: ./scripts/build-release.sh
      - name: Check version and archive
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test "${TAG#v}" = "$(./spotirip-lossless-linux-amd64/spotirip-lossless --version)"
          sha256sum -c spotirip-lossless-linux-amd64.tar.gz.sha256
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          dist/spotirip-lossless-linux-amd64.tar.gz
          dist/spotirip-lossless-linux-amd64.tar.gz.sha256
          dist/update-manifest.json
          --title "SpotiRip Lossless ${{ github.ref_name }}"
          --generate-notes
